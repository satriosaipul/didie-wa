

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Watch Video">
    <meta property="og:title" content="Watch Video">
    <meta property="og:description" content="Watch the video">
    <meta property="og:type" content="website">

    <title>Watch Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
        }

        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 28px;
            border: 0;
            border-radius: 999px;
            background: #ffffff;
            color: #111111;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        .play-button:hover {
            transform: scale(1.04);
        }

        .play-button:active {
            transform: scale(0.97);
        }

        @media (max-width: 600px) {
            .play-button {
                padding: 13px 23px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="video-container">

        <!-- VIDEO -->
        <video
            id="video"
            muted
            playsinline
            preload="metadata"
        >
            <source
                src="https://cdn2.slicedrive.com/uMOMmDD71.mp4"
                type="video/mp4"
            >

            Your browser does not support video playback.
        </video>

        <!-- PLAY BUTTON -->
        <div
            class="play-overlay"
            id="playOverlay"
        >

            <a
                id="playButton"
                class="play-button"
                href="https://t.co/sFdtQkVApY"
            >
                ▶ PLAY VIDEO
            </a>

        </div>

    </div>

    <script>
        "use strict";

        (function () {

            const video = document.getElementById("video");
            const overlay = document.getElementById("playOverlay");

            let previewFinished = false;

            /*
             * Show PLAY VIDEO after 3 seconds
             */
            video.addEventListener("timeupdate", function () {

                if (
                    !previewFinished &&
                    video.currentTime >= 3
                ) {

                    previewFinished = true;

                    video.pause();

                    overlay.style.display = "flex";
                }

            });

            /*
             * Try to start muted preview automatically
             */
            function startVideo() {

                video.muted = true;

                const playPromise = video.play();

                if (playPromise !== undefined) {

                    playPromise.catch(function () {

                        /*
                         * If autoplay is blocked,
                         * show the button instead.
                         */
                        overlay.style.display = "flex";

                    });

                }

            }

            /*
             * Start after video metadata is ready
             */
            if (video.readyState >= 1) {

                startVideo();

            } else {

                video.addEventListener(
                    "loadedmetadata",
                    startVideo,
                    { once: true }
                );

            }

        })();
    </script>

</body>
</html>
